<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Logme</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="header">
            <h1 id="heading">Logme</h1>
        </div>
        <div class="app">
            <div class="chat-panel">
                <div class="messages-area-wrapper">
                    <div class="messages-area" id="messagesArea"></div>
                </div>
                <div class="input-area">
                    <input type="text" id="inputField" placeholder="Describe your timelog">
                    <button id="sendButton" onclick="handleSubmit()">Send</button>
                </div>
            </div>
            <div class="main-area">
                
            </div>
        </div>
        <script src="renderer.js"></script>
    </body>
</html>
